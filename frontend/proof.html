<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IGNIS Proof Verifier</title><meta name="description" content="Verify an IGNIS anonymous contribution proof receipt.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080b10;color:#e2e8f0;font:14px/1.6 Inter,sans-serif;display:grid;place-items:center;padding:24px}main{width:min(760px,100%)}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;margin-bottom:24px}.brand img{width:34px;height:34px;filter:drop-shadow(0 0 14px rgba(0,255,65,.35))}.panel{border:1px solid rgba(167,139,250,.2);background:#0d1117;padding:28px}.label{font:11px JetBrains Mono;color:#2dd4bf;text-transform:uppercase;letter-spacing:.12em}h1{font-size:34px;margin:8px 0 10px}p{color:#94a3b8}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin:24px 0}input,button{font:inherit;border:1px solid rgba(167,139,250,.22);border-radius:4px;padding:11px 12px}input{background:#080b10;color:#e2e8f0;outline:none}input:focus{border-color:#a78bfa}button{background:#a78bfa;color:#080b10;font-weight:700;cursor:pointer}.result{border-top:1px solid rgba(167,139,250,.16);padding-top:22px}.grid{display:grid;grid-template-columns:150px 1fr;gap:9px 16px;margin:16px 0}.grid span:nth-child(odd){color:#94a3b8}.grid span:nth-child(even){font-family:JetBrains Mono;overflow-wrap:anywhere}.valid{color:#4ade80}.invalid{color:#f87171}.hidden{display:none}.anchor{display:inline-flex;color:#2dd4bf;text-decoration:none}@media(max-width:600px){.panel{padding:20px}.search{grid-template-columns:1fr}.grid{grid-template-columns:1fr}h1{font-size:27px}}
</style>
</head>
<body><main><a class="brand" href="/"><img src="/ignis-mark.svg?v=2" alt=""><span>IGNIS</span></a><section class="panel"><div class="label">Public verification</div><h1>Proof receipt verifier</h1><p>Verify receipt integrity and inspect its Solana anchor state without revealing the contributor's identity.</p><div class="search"><input id="proof-id" placeholder="proof_..."><button id="verify">Verify</button></div><div id="result" class="result hidden"></div></section></main>
<script>
const API=['localhost','127.0.0.1'].includes(location.hostname)?'http://localhost:3001':'https://api.ignis-protocol.com';const input=document.getElementById('proof-id');const result=document.getElementById('result');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function verify(){const id=input.value.trim();result.classList.remove('hidden');if(!id){result.innerHTML='<div class="invalid">Enter a proof id first.</div>';input.focus();return}result.innerHTML='<p>Verifying receipt...</p>';try{const response=await fetch(`${API}/api/proofs/${encodeURIComponent(id)}`);const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error?.message||'Verification failed');const p=data.proof;result.innerHTML=`<div class="${data.valid?'valid':'invalid'}">${data.valid?'VALID IGNIS RECEIPT':'INVALID RECEIPT'}</div><div class="grid"><span>Proof</span><span>${esc(p.id)}</span><span>Proof hash</span><span>${esc(p.proof_hash)}</span><span>Diff hash</span><span>${esc(p.diff_hash)}</span><span>Decision</span><span>${esc(p.decision)}</span><span>Score</span><span>${esc(p.score)} / 10</span><span>Quorum</span><span>${esc(p.quorum)}</span><span>Issued</span><span>${esc(p.issued_at)}</span><span>Owner</span><span>${p.owner_commitment?'private commitment attached':'anonymous session only'}</span><span>Solana</span><span>${esc(p.anchor.status)}</span></div>${p.anchor.explorer_url?`<a class="anchor" href="${esc(p.anchor.explorer_url)}" target="_blank" rel="noopener noreferrer">Open Solana Explorer</a>`:''}`}catch(error){result.innerHTML=`<div class="invalid">${esc(error.message)}</div>`}}
document.getElementById('verify').addEventListener('click',verify);input.addEventListener('keydown',event=>{if(event.key==='Enter')verify()});const query=new URLSearchParams(location.search).get('id');if(query){input.value=query;verify()}
</script></body></html>
